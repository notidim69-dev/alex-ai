<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex AI — V3 Safe</title><style>*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:#f5f7fb;color:#101828}.hide{display:none!important}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#0b1f46;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:20px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#635bff,#5cc8ff);display:grid;place-items:center;font-weight:900}.nav button{display:block;width:100%;border:0;background:transparent;color:#dbe5f5;text-align:left;padding:11px;border-radius:9px;margin:3px 0;font-weight:750;cursor:pointer}.nav button:hover,.nav button.active{background:#3147d9;color:#fff}.logout{position:absolute;bottom:18px;left:18px;right:18px;border:1px solid #36517d;background:transparent;color:#fff;padding:10px;border-radius:9px;cursor:pointer}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid #e6eaf1;padding:13px 22px;position:sticky;top:0;z-index:5}.top input{width:min(620px,70vw);padding:12px 14px;border:1px solid #dfe4ec;border-radius:12px}.content{padding:20px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.card{background:#fff;border:1px solid #e5eaf2;border-radius:14px;padding:15px}.kpi{cursor:pointer}.kpi b{font-size:28px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-top:14px}.hero{display:grid;grid-template-columns:1fr 190px;gap:15px}.name{font-size:24px;font-weight:900}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{background:#eef2ff;color:#3538cd;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800}.score{font-size:34px;color:#079455;font-weight:900}.tabs{display:flex;gap:18px;border-bottom:1px solid #e5e7eb;margin-top:14px}.tabs button{border:0;background:transparent;padding:10px 2px;font-weight:800;cursor:pointer}.tabs button:hover{color:#3538cd}.signal{border-left:4px solid #f79009;border-radius:10px;padding:10px;border-top:1px solid #e5e7eb;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin:8px 0}.muted{color:#667085;font-size:12px}.contacts .person{padding:9px 0;border-bottom:1px solid #eef1f5}.person:last-child{border-bottom:0}.accounts{width:100%;border-collapse:collapse}.accounts th,.accounts td{padding:10px;border-bottom:1px solid #eef1f5;text-align:left}.accounts tr:hover{background:#fafbff;cursor:pointer}.login{position:fixed;inset:0;background:#081735;z-index:99;display:grid;place-items:center}.loginbox{width:min(420px,92vw);background:#fff;border-radius:18px;padding:24px}.loginbox input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0}.loginbox button{width:100%;border:0;background:#4f46e5;color:#fff;padding:12px;border-radius:10px;font-weight:900;cursor:pointer}.searchbox{position:absolute;top:57px;left:22px;width:min(620px,70vw);background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 14px 30px rgba(16,24,40,.12);z-index:20;max-height:320px;overflow:auto;display:none}.opt{width:100%;border:0;background:#fff;text-align:left;padding:10px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="login"><div class="loginbox"><h2>Alex AI</h2><div class="muted">Sales Intelligence Cockpit</div><input id="u" placeholder="Identifiant"><input id="p" type="password" placeholder="Mot de passe"><div id="err" style="color:#b42318;min-height:18px"></div><button id="loginBtn">Se connecter</button></div></div><div class="shell"><aside class="side"><div class="brand"><div class="logo">AI</div><div><b>ALEX AI</b><div style="color:#b8c4d8;font-size:12px">Sales Intelligence</div></div></div><div class="nav"><button id="navOverview" class="active">⌂ Vue d'ensemble</button><button id="navAccounts">▦ Comptes</button><button data-scroll="signals">⌁ Signal Radar</button><button data-scroll="contacts">♙ Décideurs</button></div><button id="logoutBtn" class="logout">Déconnexion</button></aside><main class="main"><div class="top"><input id="search" placeholder="Rechercher un compte…"><div id="searchbox" class="searchbox"></div></div><div class="content"><section id="overview"><div class="kpis"><div class="kpi" data-filter="hot">🔥<b id="hot">0</b><span>Comptes HOT</span></div><div class="kpi" data-filter="risk">⚠️<b id="risk">0</b><span>Comptes à risque</span></div><div class="kpi" data-filter="project">🚀<b id="project">0</b><span>Projets potentiels</span></div><div class="kpi">◉<b id="avg">0</b><span>Score moyen</span></div></div><div class="grid"><div><div class="card"><div class="hero"><div><div class="name" id="company">—</div><div class="muted" id="context"></div><div id="chips" class="chips"></div></div><div><div class="muted">Score intention projet</div><div id="score" class="score">0</div></div></div><div class="tabs"><button data-scroll="signals">Signal Radar</button><button data-scroll="contacts">Décideurs</button><button data-scroll="projects">Projets</button></div></div><div id="signals" class="card" style="margin-top:14px"><h3>📡 Signal Radar</h3><div id="signalList"></div></div><div id="projects" class="card" style="margin-top:14px"><h3>Projets</h3><div id="projectList"></div></div></div><div><div class="card"><h3>🎯 Prochaine meilleure action</h3><div id="nba"></div></div><div id="contacts" class="card contacts" style="margin-top:14px"><h3>Décideurs clés</h3><div id="contactList"></div></div></div></div></section><section id="accountsView" class="hide"><div class="card"><h2>Comptes</h2><table class="accounts"><thead><tr><th>Compte</th><th>Score</th><th>Contexte</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main></div><script src="data.js?v=safe20260903"></script><script src="news.js?v=safe20260903"></script><script>const A=window.ACCOUNTS||[];const CONTACTS={"DEMATHIEU BARD":[{role:"Directeur Général Finances Groupe / membre du Directoire",name:"Vincent Monnot"},{role:"Directeur des Ressources Humaines Groupe",name:"Michael Heinz"}],"AXA":[{role:"Directeur Financier",name:"Bertrand Poupart-Lafarge"},{role:"Directeur Transformation & Technologie",name:"Christophe Vermont"},{role:"Directrice des Ressources Humaines",name:"Amélie Watelet"}],"CIRCET":[{role:"Directeur administratif & financier",name:"Charles-Marie Desmaizières"},{role:"Directrice des ressources humaines",name:"Pamela Fillon"}],"CHARIER":[{role:"Directeur Administratif et Financier",name:"Florent Derely"},{role:"Directeur des Systèmes d’Information",name:"Dominique Dubuc"},{role:"Directeur Ressources Humaines",name:"Constant Charier"}],"EUROAPI":[{role:"Directeur financier",name:"Olivier Falut"},{role:"Chief People Officer",name:"Raphaële Hauzy"},{role:"Directeur de la Transformation",name:"Matthias Cools"}]};let current=null,filter='';const $=id=>document.getElementById(id);const USER='alexandre',HASH='d2a74a0e698a021f3b1574c8ee5a4b13a8502a6bc7cdf7f24842b4bec2a4eca1';async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function doLogin(){if($('u').value.trim()===USER&&(await sha($('p').value))===HASH){sessionStorage.ok='1';$('login').classList.add('hide')}else $('err').textContent='Identifiant ou mot de passe incorrect.'}$('loginBtn').addEventListener('click',doLogin);$('p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('ok');location.reload()});if(sessionStorage.ok==='1')$('login').classList.add('hide');function text(a){return[a.name,a.comment,a.web?.title,a.web?.project,a.web?.angle,...(a.stack||[]).flat()].filter(Boolean).join(' ').toLowerCase()}function isRisk(a){return/blacklist|aucune confiance|risque remplacement|projet perdu|gel des projets|licenc|pas contents|pas content|image cegid|prix/.test(text(a))}function isProject(a){return!!(a.web&&a.web.project)}function score(a){return Math.min(100,Math.round(a.score+(a.web?12:0)+(isProject(a)?7:0)-(isRisk(a)?8:0)))}function signalItems(a){const x=text(a),s=[];if(a.web)s.push(['Signal web qualifié',a.web.title,a.web.source,a.web.url]);if(isProject(a))s.push(['Projet explicite',a.web.project,a.web.source,a.web.url]);if(/erp|sap|ifs|oracle|dynamics|sage/.test(x))s.push(['Transformation ERP / SI','Environnement ERP structurant','Recherche ciblée',`https://www.google.com/search?q=${encodeURIComponent('"'+a.name+'" ERP SI transformation')}`]);if(/paie|sirh|talent|workday|adp|silae/.test(x))s.push(['Transformation RH / Paie','Évolution RH / paie / talent','Recherche ciblée',`https://www.google.com/search?q=${encodeURIComponent('"'+a.name+'" SIRH paie talent')}`]);if(/cash|tr[eé]so|tms|bfr/.test(x))s.push(['Signal cash / trésorerie','Contexte cash / trésorerie','Recherche ciblée',`https://www.google.com/search?q=${encodeURIComponent('"'+a.name+'" trésorerie cash TMS')}`]);return s}function nba(a){if(isRisk(a))return'Priorité : sécuriser la relation et reconstruire un sponsor.';if(a.web?.angle)return a.web.angle;return'Utiliser le signal le plus récent pour ouvrir un échange sur la feuille de route 12–18 mois.'}function openAccount(name){current=A.find(a=>a.name===name)||A[0];if(!current)return;showOverview();$('company').textContent=current.name;$('context').textContent=current.web?.project||current.comment||'Compte du portefeuille';$('chips').innerHTML=(current.stack||[]).map(x=>`<span class="chip">${x[0]} · ${x[1]}</span>`).join('');$('score').textContent=score(current)+'/100';$('signalList').innerHTML=signalItems(current).map(s=>`<div class="signal"><b>${s[0]}</b><div class="muted">${s[1]}</div>${s[3]?`<a href="${s[3]}" target="_blank">${s[2]} ↗</a>`:''}</div>`).join('')||'<div class="muted">Aucun signal structurant.</div>';$('projectList').innerHTML=isProject(current)?`<b>${current.web.project}</b>`:'<span class="muted">Aucun projet explicite.</span>';$('nba').textContent=nba(current);const cc=CONTACTS[current.name]||[];$('contactList').innerHTML=cc.map(c=>`<div class="person"><b>${c.name}</b><div class="muted">${c.role}</div></div>`).join('')||'<div class="muted">Aucun décideur vérifié.</div>'}function showOverview(){$('overview').classList.remove('hide');$('accountsView').classList.add('hide');$('navOverview').classList.add('active');$('navAccounts').classList.remove('active')}function showAccounts(){$('overview').classList.add('hide');$('accountsView').classList.remove('hide');$('navAccounts').classList.add('active');$('navOverview').classList.remove('active');renderRows()}$('navOverview').addEventListener('click',showOverview);$('navAccounts').addEventListener('click',()=>{filter='';showAccounts()});document.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>{showOverview();setTimeout(()=>$(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'}),20)}));document.querySelectorAll('[data-filter]').forEach(k=>k.addEventListener('click',()=>{filter=k.dataset.filter;showAccounts()}));function renderRows(){let arr=A.filter(a=>filter==='hot'?score(a)>=80:filter==='risk'?isRisk(a):filter==='project'?isProject(a):true).sort((a,b)=>score(b)-score(a));$('rows').innerHTML=arr.map(a=>`<tr data-name="${a.name.replace(/"/g,'&quot;')}"><td><b>${a.name}</b></td><td>${score(a)}</td><td>${a.web?.title||a.comment||'Veille continue'}</td></tr>`).join('');$('rows').querySelectorAll('tr').forEach(r=>r.addEventListener('click',()=>openAccount(r.dataset.name)))}$('hot').textContent=A.filter(a=>score(a)>=80).length;$('risk').textContent=A.filter(isRisk).length;$('project').textContent=A.filter(isProject).length;$('avg').textContent=Math.round(A.reduce((n,a)=>n+score(a),0)/Math.max(1,A.length));const sb=$('searchbox');$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();if(!q){sb.style.display='none';return}const m=A.filter(a=>a.name.toLowerCase().includes(q)).slice(0,8);sb.innerHTML=m.map(a=>`<button class="opt" data-name="${a.name.replace(/"/g,'&quot;')}"><b>${a.name}</b></button>`).join('')||'<div style="padding:10px">Aucun compte</div>';sb.style.display='block';sb.querySelectorAll('[data-name]').forEach(b=>b.addEventListener('click',()=>{openAccount(b.dataset.name);$('search').value=b.dataset.name;sb.style.display='none'}))});renderRows();openAccount((A.find(a=>a.name==='DEMATHIEU BARD')||A[0]||{}).name);</script></body></html>
